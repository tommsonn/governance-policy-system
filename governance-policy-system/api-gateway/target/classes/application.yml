server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        - id: policy-service
          uri: lb://POLICY-SERVICE
          predicates:
            - Path=/policies/**
            - Method=GET,POST,PUT,DELETE

        - id: audit-service
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/audit/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka:123456@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.governance: DEBUG