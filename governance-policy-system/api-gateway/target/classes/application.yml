server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        # AUTHENTICATION ROUTES (PUBLIC - No JWT Required)
        - id: auth-service
          uri: lb://API-GATEWAY
          predicates:
            - Path=/auth/**

        # POLICY SERVICE ROUTES (PROTECTED - JWT Required)
        - id: policy-service
          uri: lb://POLICY-SERVICE
          predicates:
            - Path=/policies/**
            - Method=GET,POST,PUT,DELETE
          filters:
            - name: CircuitBreaker
              args:
                name: policyServiceCircuitBreaker
                fallbackUri: forward:/fallback/policies
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 3
                redis-rate-limiter.burstCapacity: 5
                key-resolver: "#{@ipKeyResolver}"

        # AUDIT SERVICE ROUTES (PROTECTED - JWT Required)
        - id: audit-service
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/audit/**
          filters:
            - name: CircuitBreaker
              args:
                name: auditServiceCircuitBreaker
                fallbackUri: forward:/fallback/audit


        # FALLBACK ROUTES (PUBLIC)

        - id: fallback
          uri: lb://API-GATEWAY
          predicates:
            - Path=/fallback/**

  # REDIS CONFIGURATION (For Rate Limiting)

  data:
    redis:
      host: localhost
      port: 6379

  # SECURITY CONFIGURATION
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json


# JWT CONFIGURATION
jwt:
  secret: mySuperSecretKeyForJWTValidationThatIsAtLeast32Chars
  expiration: 86400000   # 24 hours in milliseconds

# EUREKA SERVICE DISCOVERY
eureka:
  client:
    service-url:
      defaultZone: http://eureka:123456@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# RESILIENCE4J CIRCUIT BREAKER
resilience4j:
  circuitbreaker:
    instances:
      policyService:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
      auditService:
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        waitDurationInOpenState: 30s

# ACTUATOR / MANAGEMENT
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,metrics
  endpoint:
    gateway:
      enabled: true

# LOGGING
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    com.governance: DEBUG