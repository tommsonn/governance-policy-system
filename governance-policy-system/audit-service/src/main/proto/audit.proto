syntax = "proto3";

package com.governance.grpc;

option java_package = "com.governance.grpc";
option java_multiple_files = true;

service AuditService {
  rpc logAction (AuditRequest) returns (AuditResponse);
}

message AuditRequest {
  string eventType = 1;
  int64 policyId = 2;
  string actor = 3;
  string timestamp = 4;
}

message AuditResponse {
  bool success = 1;
  string message = 2;
}