server:
  port: 8761

spring:
  application:
    name: eureka-server
  security:
    basic:
      enabled: true
    user:
      name: eureka
      password: 123456

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

logging:
  level:
    com.netflix.eureka: INFO